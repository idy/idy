name: Sync pinned repositories

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read

concurrency:
  group: pinned-projects-main
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Test snapshot validation
        run: node --test tests/pinned-projects.test.mjs tests/publish-snapshot.test.mjs tests/sync-guard.test.mjs

  refresh:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
      - name: Check that the tested commit is still current
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/sync-guard.sh check
      - name: Read public pinned repositories
        if: steps.current.outputs.current == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/sync-pins.mjs
      - name: Publish a changed snapshot
        if: steps.current.outputs.current == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/publish-snapshot.sh
